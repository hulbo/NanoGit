[package]
name = "nanogit"
version = "0.1.0"
description = "AI가 하는 git 작업을 지켜보는 가벼운 git 모니터"
authors = ["hulbo"]
license = "MIT"
repository = "https://github.com/hulbo/NanoGit"
edition = "2024"
rust-version = "1.90"

[lib]
name = "nanogit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
encoding_rs = "0.8.44"
dirs = "7.0.0"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"
