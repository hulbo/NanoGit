name: build

# main push·PR: 검사·테스트·설치본 빌드
# 태그 v* push: 같은 빌드를 한 뒤 버전을 확인하고 GitHub 릴리스를 만들어 설치본을 올린다
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 버전 확인 (태그면 태그와도)
        run: node scripts/version.mjs check ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: 의존성 설치
        run: npm ci

      - name: 프론트엔드 타입 검사
        run: npm run check

      - name: 프론트엔드 테스트
        run: npm test

      - name: 프론트엔드 빌드
        run: npm run build

      - name: 백엔드 테스트
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 설치본 빌드
        run: npm run tauri build

      - name: 설치본 업로드
        uses: actions/upload-artifact@v7
        with:
          name: nanogit-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 릴리스 만들기
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(src-tauri/target/release/bundle/nsis/*.exe)
          if [ -f "docs/releases/$TAG.md" ]; then notes=(--notes-file "docs/releases/$TAG.md"); else notes=(--generate-notes); fi
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            # 다시 실행한 경우: 설치본만 바꿔 올린다
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "NanoGit ${TAG#v}" --verify-tag "${notes[@]}" "${prerelease[@]}"
          fi
